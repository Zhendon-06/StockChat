#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
#Kotlin
kotlin.code.style=official
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2
# The shared and chart modules declare an explicit iOS source-set hierarchy
# (iosMain/iosTest). Keep that hierarchy authoritative instead of letting the
# Kotlin plugin synthesize a second default hierarchy during configuration.
kotlin.mpp.applyDefaultHierarchyTemplate=false
ksp.incremental=false
# Keep the legacy Java 8 bytecode target while avoiding JDK 21's noisy
# source/target compatibility warning during local Android builds.
android.javaCompile.suppressSourceTargetDeprecationWarning=true
